name: xcpng
display_name: XCP-ng
description: Back up XCP-ng virtual machines disk by disk, and restore them.
api_version: v1.1.0
connectors:
- type: importer
  executable: xcpngImporter
  protocols: [xcpng]
  validator: ./importer/schema.json
  class: hypervisor
- type: exporter
  executable: xcpngExporter
  protocols: [xcpng]
  validator: ./exporter/schema.json
  class: hypervisor
