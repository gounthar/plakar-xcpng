version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - go
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The plugin's gRPC contract with plakar comes from these modules, so they
      # move together, majors included.
      plakar:
        patterns:
          - github.com/PlakarKorp/*
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
