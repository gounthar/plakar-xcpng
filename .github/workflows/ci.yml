---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it packages a tag.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet and race tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

  checks:
    name: Format, modules, vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: YAML
        run: pipx run yamllint==1.38.0 --strict .github/workflows .github/dependabot.yml manifest.yaml .yamllint.yml
      - name: JSON schemas
        run: |
          for f in importer/schema.json exporter/schema.json; do
            python3 -m json.tool "$f" >/dev/null || { echo "invalid JSON: $f"; exit 1; }
          done

  cross-build:
    name: Build linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  # Install the package with plakar 1.1.7 for the same architecture on a native runner
  # and make plakar start the importer. There is no pool to reach from here, so
  # the importer's login error is the expected result: it proves plakar ran the
  # plugin binary and spoke to it over gRPC.
  # PlakarKorp publishes no riscv64 release asset, so build plakar from the
  # release tag for the riscv64 smoke job.
  plakar-riscv64:
    name: Build plakar linux/riscv64
    runs-on: ubuntu-24.04
    env:
      PLAKAR_VERSION: 1.1.7
      # Commit the v1.1.7 tag points to; the build stops if the tag moves.
      PLAKAR_COMMIT: c8d93c212ab21d1bdc4a85f0120cedfa246504a1
    steps:
      # The binary depends only on the plakar commit, so a cache hit skips the
      # checkout, Go setup and build. The key holds the commit, which is what
      # the tag check below would otherwise establish.
      - uses: actions/cache@v6
        id: cache
        with:
          path: ${{ runner.temp }}/plakar-bin
          key: plakar-${{ env.PLAKAR_COMMIT }}-linux-riscv64-cgo0
      - uses: actions/checkout@v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: PlakarKorp/plakar
          ref: v${{ env.PLAKAR_VERSION }}
          path: plakar-src
          persist-credentials: false
      - name: Check the tag
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: plakar-src
        run: test "$(git rev-parse HEAD)" = "$PLAKAR_COMMIT"
      - uses: actions/setup-go@v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version-file: plakar-src/go.mod
          cache: false
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: plakar-src
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: riscv64
        run: go build -trimpath -o "$RUNNER_TEMP/plakar-bin/plakar" .
      - uses: actions/upload-artifact@v7
        with:
          name: plakar-linux-riscv64
          path: ${{ runner.temp }}/plakar-bin/plakar
          if-no-files-found: error
          retention-days: 1

  package-smoke:
    name: Package smoke linux/${{ matrix.goarch }}
    needs: plakar-riscv64
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
            # sha256 of plakar_1.1.7_linux_amd64.tar.gz, from the release's checksums file.
            plakar_sha256: 95a6a36546064df033a8f9bae0837c625de3fbcb209b9795d7f2034a733e85fa
          - goarch: arm64
            runner: ubuntu-24.04-arm
            # sha256 of plakar_1.1.7_linux_arm64.tar.gz, from the release's checksums file.
            plakar_sha256: b2886861abcce04ad8098317f3b5259905285287438aeff22d544a8cff18fc66
          # RISE runner, one fresh board per job. plakar comes from plakar-riscv64.
          - goarch: riscv64
            runner: ubuntu-24.04-riscv
    env:
      PLAKAR_VERSION: 1.1.7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet and race tests
        run: make test
      - name: Install plakar
        if: matrix.goarch != 'riscv64'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAKAR_SHA256: ${{ matrix.plakar_sha256 }}
        run: |
          tarball="plakar_${PLAKAR_VERSION}_linux_${{ matrix.goarch }}.tar.gz"
          gh release download "v${PLAKAR_VERSION}" -R PlakarKorp/plakar -p "$tarball" -D "$RUNNER_TEMP"
          echo "${PLAKAR_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          mkdir "$RUNNER_TEMP/plakar"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/plakar" plakar
          echo "$RUNNER_TEMP/plakar" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        if: matrix.goarch == 'riscv64'
        with:
          name: plakar-linux-riscv64
          path: ${{ runner.temp }}/plakar
      - name: Install plakar built from source
        if: matrix.goarch == 'riscv64'
        run: |
          chmod +x "$RUNNER_TEMP/plakar/plakar"
          echo "$RUNNER_TEMP/plakar" >> "$GITHUB_PATH"
      - name: Package
        env:
          CGO_ENABLED: '0'
        run: make package VERSION=v0.0.0-ci
      - name: Install package
        run: |
          plakar pkg add -allow-unsigned ./xcpng_v0.0.0-ci_linux_${{ matrix.goarch }}.ptar
          plakar pkg list | grep -Fx 'xcpng@v0.0.0-ci'
      - name: Start the importer
        env:
          PLAKAR_PASSPHRASE: ci-throwaway
        run: |
          store="$RUNNER_TEMP/store"
          plakar source add smoke xcpng://127.0.0.1:1 password=x \
            vm_uuid=00000000-0000-0000-0000-000000000000
          plakar at "$store" create
          # plakar can exit 0 on some failures, so check the message, not only the status.
          if out=$(plakar at "$store" backup -no-progress @smoke 2>&1); then
            echo "$out"
            echo "backup unexpectedly succeeded"
            exit 1
          fi
          echo "$out"
          grep -q 'session.login_with_password' <<<"$out"
