---
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  PLAKAR_VERSION: 1.1.8
  # sha256 of plakar_1.1.8_linux_amd64.tar.gz, from the release's checksums file.
  PLAKAR_SHA256: 67c6237eb26ef2cb864941e8444b8877fa6531a0fc9b2a332653b455ea2831b4

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    name: Package linux/${{ matrix.goarch }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64, riscv64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install plakar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="plakar_${PLAKAR_VERSION}_linux_amd64.tar.gz"
          gh release download "v${PLAKAR_VERSION}" -R PlakarKorp/plakar -p "$tarball" -D "$RUNNER_TEMP"
          echo "${PLAKAR_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          mkdir "$RUNNER_TEMP/plakar"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/plakar" plakar
      # plakar pkg create names the package after GOOS/GOARCH from the environment.
      - name: Package
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: make package PLAKAR="$RUNNER_TEMP/plakar/plakar" VERSION="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: ptar-${{ matrix.goarch }}
          path: xcpng_*.ptar
          if-no-files-found: error

  release:
    name: GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ptar-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum xcpng_*.ptar > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${flags[@]}" \
            xcpng_*.ptar SHA256SUMS
